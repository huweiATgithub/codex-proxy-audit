[package]
name = "codex-proxy-audit"
version = "0.1.13"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "447869860a0fb88f78109cdb700db0cb1eb5d8b5", features = ["io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "94aafe3a68884d923b0798a767c8d7f6cfda89d2", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
# Pin the upstream SQLite 3.54.0 bundle until its next crates.io release.
libsqlite3-sys = { version = "=0.38.1", default-features = false, features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
url = "2"
thiserror = "2"
anyhow = "1"
crossbeam-queue = "0.3"
regex = "1"
arc-swap = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"

[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite", rev = "1d5d0ecae8b8372c2779caf5ab98847155dba153" }

[profile.release]
strip = true
lto = "thin"
