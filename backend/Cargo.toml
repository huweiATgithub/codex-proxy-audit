[package]
name = "codex-proxy-audit"
version = "0.1.5"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "389dc63633a3b24c5b40b0002901371820bc6998", features = ["io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
url = "2"
thiserror = "2"
anyhow = "1"
crossbeam-queue = "0.3"

[profile.release]
strip = true
lto = "thin"
