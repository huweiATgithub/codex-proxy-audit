name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-package
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-evidence
          path: dist/verification
      - name: Prepare release assets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test -s dist/verification/result.json
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "dist/release/huwei.prompt-audit-$VERSION-verification.tar.gz" -C dist/verification .
          cp LICENSE dist/verification/*.png dist/release/
          (cd dist/release && sha256sum --check ./*.sha256 && sha256sum ./*.tar.gz ./*.sha256 ./LICENSE ./*.png > SHA256SUMS)
      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          HOST_VERSION: ${{ needs.verify.outputs.host-version }}
        run: bash scripts/publish-release.sh
